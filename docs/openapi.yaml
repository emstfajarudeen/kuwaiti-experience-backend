openapi: 3.1.0
info:
  title: The Kuwaiti Experience API
  version: 1.0.0
  description: >-
    Public guide content and bearer-authenticated admin CMS API. Admin browser pages
    at /admin use HttpOnly cookies and CSRF-protected HTML forms instead.
servers:
  - url: http://localhost:3333
paths:
  /api/v1/health:
    get:
      tags: [Public]
      summary: HTTP health check
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/home:
    get:
      tags: [Public]
      summary: Landing page hero, category type tiles and featured place groups
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/site:
    get:
      tags: [Public]
      summary: Public branding, contact and store links
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/categories:
    get:
      tags: [Public]
      summary: Active categories for one place type
      parameters:
        - { $ref: '#/components/parameters/PlaceType' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/places:
    get:
      tags: [Public]
      summary: Published place cards with filtered pagination totals
      parameters:
        - { $ref: '#/components/parameters/PlaceType' }
        - { $ref: '#/components/parameters/Locale' }
        - in: query
          name: category
          description: Category slug; omit or use `all` to include all categories and uncategorized places.
          schema: { type: string }
        - { in: query, name: q, schema: { type: string, maxLength: 80 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: perPage, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedPlaces' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/places/{slug}:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    get:
      tags: [Public]
      summary: Published place details, ordered gallery, visit data and cab metadata
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/pages/{slug}:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    get:
      tags: [Public]
      summary: Published static page
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/transport/locations:
    get:
      tags: [Public]
      summary: Active pickup and destination locations
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/transport/enquiry-link:
    post:
      tags: [Public]
      summary: Return a WhatsApp enquiry URL; no reservation is created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupId, destinationId, dateTime]
              properties:
                pickupId: { type: integer, minimum: 1 }
                destinationId: { type: integer, minimum: 1 }
                dateTime: { type: string, format: date-time, description: Interpreted in Asia/Kuwait }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/images/{key}:
    parameters: [{ $ref: '#/components/parameters/ImageKey' }]
    get:
      tags: [Public]
      summary: Serve an image only while it is owned by visible content
      description: >-
        Served for the cover or gallery image of a published place (published_at in the past),
        any category type tile image, any homepage hero, the site logo, and posters of published
        movies. Unowned, hidden or non-managed keys return 404. Responses use
        `Cache-Control: public, max-age=60` and `X-Content-Type-Options: nosniff`.
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/auth/login:
    post:
      tags: [Authentication]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/admin/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate an opaque refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/admin/auth/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Current administrator
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Revoke the current session
      responses: { '204': { description: Signed out } }
  /api/v1/admin/auth/password:
    patch:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Change password and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 14 }
      responses: { '204': { description: Changed; re-authentication required } }
  /api/v1/admin/images/{key}:
    parameters: [{ $ref: '#/components/parameters/ImageKey' }]
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Preview any image still owned by a record, including drafts
      description: >-
        The CMS uses the cookie-authenticated equivalent `/admin/images/{key}`. Responses use
        `Cache-Control: private, no-store`.
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Actual content counts and recent audit actions
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/places:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Admin place list
      parameters:
        - { in: query, name: type, schema: { $ref: '#/components/schemas/PlaceType' } }
        - { in: query, name: status, schema: { type: string, enum: [draft, published, archived] } }
        - { in: query, name: q, schema: { type: string, maxLength: 80 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Create a draft place
      requestBody: { $ref: '#/components/requestBodies/Place' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/places/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Admin place editor data
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Replace editable place fields
      requestBody: { $ref: '#/components/requestBodies/Place' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Permanently delete a place
      responses: { '204': { description: Deleted } }
  /api/v1/admin/places/{id}/preview:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Public-shaped response for a draft or published place
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/places/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Publish a complete place
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/places/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Hide a place from public APIs
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/places/{id}/cover:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Upload or replace the place cover image
      requestBody: { $ref: '#/components/requestBodies/SingleImage' }
      responses:
        '200': { $ref: '#/components/responses/PlaceImages' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Remove the cover image (not allowed while published)
      responses:
        '204': { description: Removed; the file is deleted after commit }
        '404': { $ref: '#/components/responses/Error' }
        '422': { description: COVER_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/places/{id}/gallery:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Add up to 5 gallery images (20 per place maximum)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: binary } }
                altEn: { type: [string, 'null'], maxLength: 255, description: Defaults to the place title }
      responses:
        '201': { $ref: '#/components/responses/PlaceImages' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { description: 'INVALID_IMAGE, TOO_MANY_FILES or GALLERY_FULL', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/admin/places/{id}/gallery/{imageId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { in: path, name: imageId, required: true, schema: { type: integer, minimum: 1 }, description: place_images.id }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Edit gallery image text and order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                altEn: { type: [string, 'null'], maxLength: 255 }
                altAr: { type: [string, 'null'], maxLength: 255 }
                captionEn: { type: [string, 'null'], maxLength: 255 }
                captionAr: { type: [string, 'null'], maxLength: 255 }
                sortOrder: { type: integer, minimum: 0, maximum: 999 }
      responses:
        '200': { $ref: '#/components/responses/PlaceImages' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Remove a gallery image; the file is deleted after commit
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/category-types:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: List category types
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Create a category type
      requestBody: { $ref: '#/components/requestBodies/CategoryType' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/category-types/{code}:
    parameters:
      - in: path
        name: code
        required: true
        schema: { $ref: '#/components/schemas/PlaceType' }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update a category type name and display order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nameEn, sortOrder]
              properties:
                nameEn: { type: string, minLength: 2, maxLength: 160 }
                nameAr: { type: [string, 'null'], maxLength: 160 }
                sortOrder: { type: integer }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Delete a category type when no categories or places use it
      description: Its tile image file is deleted after the database commit.
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/category-types/{code}/image:
    parameters:
      - in: path
        name: code
        required: true
        schema: { $ref: '#/components/schemas/PlaceType' }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Upload or replace the category type tile image
      requestBody: { $ref: '#/components/requestBodies/SingleImage' }
      responses:
        '200':
          description: Updated tile image
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [code, image_url]
                    properties:
                      code: { type: string }
                      image_url: { type: [string, 'null'], description: '/api/v1/admin/images/{key}' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Remove the tile image; the file is deleted after commit
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/categories:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: List categories
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Create category
      requestBody: { $ref: '#/components/requestBodies/Category' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update category
      requestBody: { $ref: '#/components/requestBodies/Category' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Delete unassigned category
      responses: { '204': { description: Deleted } }
  /api/v1/admin/pages:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: List static pages
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Create draft page
      requestBody: { $ref: '#/components/requestBodies/Page' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/pages/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Admin page editor data
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update page
      requestBody: { $ref: '#/components/requestBodies/Page' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Delete page
      responses: { '204': { description: Deleted } }
  /api/v1/admin/pages/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Publish a page with English title and body
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/pages/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Archive page
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/settings:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Read site settings, including `logo_image_url` (admin preview URL or null)
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update branding, contact and app-store settings (the logo is managed separately)
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/settings/logo:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Upload or replace the site logo; returns settings data
      requestBody: { $ref: '#/components/requestBodies/SingleImage' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Remove the site logo; the file is deleted after commit
      responses: { '204': { description: Removed } }
  /api/v1/admin/home:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Read homepage content for a locale, including `hero_image_url` (admin preview URL or null)
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update homepage text (the hero image is managed separately)
      requestBody: { $ref: '#/components/requestBodies/Home' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/home/hero-image:
    parameters: [{ $ref: '#/components/parameters/Locale' }]
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Upload or replace the hero image for one locale; returns homepage data
      requestBody: { $ref: '#/components/requestBodies/SingleImage' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Remove the hero image for one locale; the file is deleted after commit
      responses: { '204': { description: Removed } }
  /api/v1/admin/transport/locations:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: List all transport locations
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Create transport location
      requestBody: { $ref: '#/components/requestBodies/Location' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/admin/transport/locations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update transport location
      requestBody: { $ref: '#/components/requestBodies/Location' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Delete transport location
      responses: { '204': { description: Deleted } }
  /api/v2/customer/auth/otp:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1auth~1otp'
  /api/v2/customer/auth/otp/{id}/resend:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1auth~1otp~1{id}~1resend'
  /api/v2/customer/auth/otp/{id}/verify:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1auth~1otp~1{id}~1verify'
  /api/v2/customer/auth/session:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1auth~1session'
  /api/v2/customers:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customers'
  /api/v2/customer/auth/refresh:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1auth~1refresh'
  /api/v2/customer/me:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1me'
  /api/v2/customer/auth/logout:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1auth~1logout'
  /api/v2/pages/{slug}:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1pages~1{slug}'
  /api/v2/site:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1site'
  /api/v2/contact-requests:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1contact-requests'
  /api/v2/admin/contact-requests:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1admin~1contact-requests'
  /api/v2/admin/contact-requests/{id}:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1admin~1contact-requests~1{id}'
  /api/v2/admin/pages/{slug}:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1admin~1pages~1{slug}'
  /api/v2/admin/site:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1admin~1site'
  /api/v2/customer/me/photo:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1me~1photo'
  /api/v2/customer/me/phone/otp:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1me~1phone~1otp'
  /api/v2/customer/me/phone/otp/{id}/resend:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1me~1phone~1otp~1{id}~1resend'
  /api/v2/customer/me/phone/otp/{id}/verify:
    $ref: './customer-openapi.json#/paths/~1api~1v2~1customer~1me~1phone~1otp~1{id}~1verify'
  /api/v2/home:
    $ref: './home-openapi.json#/paths/~1api~1v2~1home'
  /api/v2/admin/home:
    $ref: './home-openapi.json#/paths/~1api~1v2~1admin~1home'
  /api/v2/admin/home/hero-image:
    $ref: './home-openapi.json#/paths/~1api~1v2~1admin~1home~1hero-image'
  /api/v2/admin/home-explore-cards:
